[package]
name = "higher-launchpad"
version = "0.1.0"
description = "Higher.run — Creator-first bonding curve launchpad with Omnipair GAMM graduation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "higher_launchpad"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# 5 SOL graduation threshold for fast devnet/local testing only.
# Build: anchor build -- --features dev-graduation
dev-graduation = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", default-features = false, features = ["metadata", "token", "associated_token", "token_2022", "token_2022_extensions"] }
sha2 = { version = "0.10", default-features = false }
