[package]
name = "higher-launchpad"
version = "0.1.0"
description = "Higher.run — Creator-first bonding curve launchpad with Omnipair GAMM graduation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "higher_launchpad"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.0", features = ["metadata"] }
mpl-token-metadata = "4.1.2"
